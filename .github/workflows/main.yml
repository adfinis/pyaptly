name: Main branch

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * 0"

jobs:
  cache:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

    - name: Login to GitHub Container Registry
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      with:
        buildkitd-flags: --debug

    - name: Build container
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
      with:
        context: compose
        push: true
        tags: ghcr.io/adfinis/pyaptly/cache:latest
        cache-from: type=registry,ref=ghcr.io/adfinis/pyaptly/cache:gha
        cache-to: type=registry,ref=ghcr.io/adfinis/pyaptly/cache:gha,mode=max

  test:
    runs-on: ubuntu-latest
    needs: [cache]

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      with:
        buildkitd-flags: --debug

    - name: Build container
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
      with:
        context: compose
        push: false
        load: true
        tags: ghcr.io/adfinis/pyaptly/cache:latest
        cache-from: type=registry,ref=ghcr.io/adfinis/pyaptly/cache:gha

    - name: Run tests
      run: |
        HYPOTHESIS_PROFILE=ci make test

  docs:
    runs-on: ubuntu-latest
    needs: [cache]

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      with:
        buildkitd-flags: --debug

    - name: Build container
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
      with:
        context: compose
        push: false
        load: true
        tags: ghcr.io/adfinis/pyaptly/cache:latest
        cache-from: type=registry,ref=ghcr.io/adfinis/pyaptly/cache:gha

    - name: Generate the docs
      run: |
        make docs

    - name: Upload artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: html-docs
        path: docs/_build/html/

    - name: Deploy
      uses: peaceiris/actions-gh-pages@e9c66a37f080288a11235e32cbe2dc5fb3a679cc # v4
      if: github.ref == 'refs/heads/main'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: docs/_build/html

  package:
    runs-on: ubuntu-latest
    needs: [test]

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      with:
        buildkitd-flags: --debug

    - name: Build container
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
      with:
        context: compose
        push: false
        load: true
        tags: ghcr.io/adfinis/pyaptly/cache:latest
        cache-from: type=registry,ref=ghcr.io/adfinis/pyaptly/cache:gha

    - name: Run tests
      run: |
        make build-packages
        make rebuild-packages

    - name: 'Upload Artifact'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: packages
        path: dist
        retention-days: 90
